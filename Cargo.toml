[package]
name = "xks-jev-base"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Jev-like typed judgments (noul / choice / score) from a local LLM's next-token distribution, on the CPU with llama.cpp: a small base to build on"
readme = "README.md"
build = "build.rs"

[lib]
name = "jevbase"
path = "src/lib.rs"

[[bin]]
name = "jevbase"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: a Choice's options keep the order the request gives them,
# which is the order they are lettered in.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
